name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lumina_ci
          POSTGRES_USER: ci_owner
          POSTGRES_PASSWORD: ci-owner-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_owner -d lumina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://ci_owner:ci-owner-placeholder@127.0.0.1:5432/lumina_ci?schema=public
      MIGRATION_DATABASE_USER: lumina_ci_migrator
      MIGRATION_DATABASE_PASSWORD: ci-migration-placeholder
      RUNTIME_DATABASE_USER: lumina_ci_runtime
      RUNTIME_DATABASE_PASSWORD: ci-runtime-placeholder
      MIGRATION_DATABASE_URL: postgresql://lumina_ci_migrator:ci-migration-placeholder@127.0.0.1:5432/lumina_ci?schema=public
      DATABASE_URL: postgresql://lumina_ci_runtime:ci-runtime-placeholder@127.0.0.1:5432/lumina_ci?schema=public
      TEST_MIGRATION_DATABASE_URL: postgresql://lumina_ci_migrator:ci-migration-placeholder@127.0.0.1:5432/lumina_ci?schema=public
      TEST_DATABASE_URL: postgresql://lumina_ci_runtime:ci-runtime-placeholder@127.0.0.1:5432/lumina_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://lumina_ci_migrator:ci-migration-placeholder@127.0.0.1:5432/lumina_ci_shadow?schema=public
      DATABASE_SAFETY_CONTEXT: ci
      NEXTAUTH_URL: http://127.0.0.1:3000
      TRUST_PROXY_HEADERS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate ephemeral authentication secrets
        run: |
          echo "NEXTAUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "SESSION_DIGEST_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_DIGEST_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "CREDENTIAL_GRANT_DIGEST_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "EMAIL_OUTBOX_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Report complete dependency audit
        continue-on-error: true
        run: npm audit

      - name: Check formatting
        run: npm run format:check

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Create isolated database roles
        run: npm run db:roles -- create

      - name: Create dedicated Prisma shadow database
        run: psql "postgresql://ci_owner:ci-owner-placeholder@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE lumina_ci_shadow OWNER lumina_ci_migrator"

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Apply least-privilege runtime grants
        run: npm run db:roles -- grant

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Check migration drift safely
        run: npm run prisma:drift

      - name: Build application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
