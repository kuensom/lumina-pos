name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lumina_ci
          POSTGRES_USER: ci_owner
          POSTGRES_PASSWORD: ci-owner-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_owner -d lumina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://ci_owner:ci-owner-placeholder@127.0.0.1:5432/lumina_ci?schema=public
      MIGRATION_DATABASE_USER: lumina_ci_migrator
      MIGRATION_DATABASE_PASSWORD: ci-migration-placeholder
      RUNTIME_DATABASE_USER: lumina_ci_runtime
      RUNTIME_DATABASE_PASSWORD: ci-runtime-placeholder
      MIGRATION_DATABASE_URL: postgresql://lumina_ci_migrator:ci-migration-placeholder@127.0.0.1:5432/lumina_ci?schema=public
      DATABASE_URL: postgresql://lumina_ci_runtime:ci-runtime-placeholder@127.0.0.1:5432/lumina_ci?schema=public
      TEST_MIGRATION_DATABASE_URL: postgresql://lumina_ci_migrator:ci-migration-placeholder@127.0.0.1:5432/lumina_ci?schema=public
      TEST_DATABASE_URL: postgresql://lumina_ci_runtime:ci-runtime-placeholder@127.0.0.1:5432/lumina_ci?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Create isolated database roles
        run: npm run db:roles -- create

      - name: Apply database migrations
        run: DATABASE_URL="$MIGRATION_DATABASE_URL" npx prisma migrate deploy

      - name: Apply least-privilege runtime grants
        run: npm run db:roles -- grant

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Build application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
